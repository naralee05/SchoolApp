<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product API Client</title>
    <!-- បញ្ចូល Bootstrap 5 និង FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <!-- Card សម្រាប់ខ្ចប់តារាង -->
        <div class="card shadow-sm border-0">
            <!-- Header -->
            <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                <h2 class="mb-0 fs-4">
                    <i class="fa-solid fa-boxes-stacked me-2"></i>បញ្ជីទំនិញ (Decoupled JS Fetch)
                </h2>
                <!-- ប៊ូតុង -->
                <button id="btnFetch" class="btn btn-light text-primary fw-bold shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-down me-1"></i> ទាញយកទិន្នន័យ API
                </button>
            </div>

            <!-- Body -->
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th class="text-center" style="width: 15%;"><i class="fa-solid fa-hashtag"></i> ID</th>
                                <th><i class="fa-solid fa-box-open"></i> ឈ្មោះទំនិញ</th>
                                <th style="width: 25%;"><i class="fa-solid fa-tag"></i> តម្លៃ</th>
                            </tr>
                        </thead>
                        <tbody id="productGrid">
                            <!-- ស្ថានភាពដើម (Initial State) -->
                            <tr>
                                <td colspan="3" class="text-center text-muted py-5">
                                    <i class="fa-regular fa-folder-open fs-1 d-block mb-3"></i>
                                    សូមចុចប៊ូតុងខាងលើដើម្បីទាញយកទិន្នន័យ...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btnFetch');
        const grid = document.getElementById('productGrid');

        btn.addEventListener('click', async () => {
            // ១. ប្ដូរ UI ពេលកំពុងដំណើរការ (Loading State)
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>កំពុងទាញយក...`;
            
            grid.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center py-5 text-primary">
                        <div class="spinner-border" role="status"></div>
                        <div class="mt-2">កំពុងដំណើរការ (Loading)...</div>
                    </td>
                </tr>`;

            try {
                // ២. ហៅ API
                const res = await fetch('https://localhost:7123/api/ProductApi');
                if (!res.ok) throw new Error('ការភ្ជាប់មានបញ្ហា');
                
                const data = await res.json();
                grid.innerHTML = ''; // សំអាតទិន្នន័យចាស់

                // ៣. បង្ហាញទិន្នន័យ
                if (data.length === 0) {
                    grid.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">មិនមានទិន្នន័យទំនិញទេ</td>
                        </tr>`;
                } else {
                    data.forEach(p => {
                        grid.innerHTML += `
                            <tr>
                                <td class="text-center fw-bold text-secondary">#${p.id}</td>
                                <td class="fw-medium text-dark">${p.name}</td>
                                <td class="text-success fw-bold">
                                    <i class="fa-solid fa-dollar-sign fa-sm"></i> ${p.price}
                                </td>
                            </tr>`;
                    });
                }
            } catch (err) {
                // ៤. ចាប់កំហុស (Error Handling)
                grid.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center text-danger py-5">
                            <i class="fa-solid fa-circle-exclamation fs-1 d-block mb-3"></i>
                            <b>CORS Error ឬ API មិនទាន់ Run!</b><br>
                            <small class="text-muted">សូមពិនិត្យមើល Backend របស់អ្នក។</small>
                        </td>
                    </tr>`;
            } finally {
                // ៥. ត្រលប់ប៊ូតុងទៅសភាពដើមវិញ
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-down me-1"></i> ទាញយកទិន្នន័យ API`;
            }
        });
    </script>
</body>
</html>
